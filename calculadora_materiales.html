<style>
:root{--ambar:#FFB000;--carbon:#393536;--negro:#100F0D;--arena:#F4F1EC;--gris:#8A8580;--verde:#1E7B4F;--rojo:#C0392B;--borde:#DCD7D0;--sombra:0 2px 10px rgba(16,15,13,.10)}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Lato,Arial,sans-serif;background:var(--arena);color:var(--carbon);font-size:15px;line-height:1.45;padding-bottom:76px}
h1,h2,h3{margin:0 0 8px}h1{font-size:20px}h2{font-size:16.5px}h3{font-size:14.5px}
.hdr{background:var(--carbon);color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:30;box-shadow:var(--sombra)}
.hdr .t{font-weight:800;font-size:15px}.hdr .s{font-size:11px;opacity:.75}
.wrap{padding:12px;max-width:820px;margin:0 auto}
.card{background:#fff;border-radius:14px;padding:13px;box-shadow:var(--sombra);margin-bottom:12px;overflow-x:auto}
label{display:block;font-size:11.5px;font-weight:700;color:var(--gris);margin:9px 0 3px;text-transform:uppercase;letter-spacing:.3px}
input,select,button{font-family:inherit;font-size:15px}
input,select{width:100%;padding:9px 10px;border:1.5px solid var(--borde);border-radius:9px;background:#fff;color:var(--carbon)}
input:focus,select:focus{outline:none;border-color:var(--ambar);box-shadow:0 0 0 3px rgba(255,176,0,.2)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 13px;font-weight:800;background:var(--carbon);color:#fff;cursor:pointer;text-decoration:none;white-space:normal;text-align:center;line-height:1.25}
/* Filas de botones de accion: en el pantalla angosta cada boton ocupa su propia
   linea, asi el texto NUNCA se sale del boton (era el caso de "Enviar esta
   cantidad al cotizador" en el telefono). */
.row.acciones>*{min-width:150px}
@media(max-width:560px){ .row.acciones>*{flex:1 1 100%} }
.btn.ambar{background:var(--ambar);color:var(--carbon)}.btn.verde{background:var(--verde)}.btn.gris{background:#fff;color:var(--carbon);border:1.5px solid var(--borde)}
.btn.sm{padding:7px 9px;font-size:13px}.btn.full{width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0 10px}
/* Las barras se ajustan en varias lineas: en el telefono no hay que desplazarse
   de lado para llegar a una actividad. Se ven todos los rubros y, debajo, todas
   las actividades del rubro elegido. */
.chip{border:1.5px solid var(--borde);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;background:#fff;color:var(--gris)}
.chip.on{background:var(--carbon);color:#fff;border-color:var(--carbon)}
/* Barra de rubros: se elige el rubro y debajo aparecen solo sus actividades */
.chips.rubros{border-bottom:2px solid var(--borde);padding-bottom:10px;margin-bottom:-2px}
.chip.rub{background:var(--arena);color:var(--carbon);font-size:12.5px;padding:6px 11px}
.chip.rub.on{background:var(--ambar);border-color:var(--ambar);color:var(--negro)}
.chip.rub .n{font-weight:900;opacity:.6;font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--ambar);color:#000;text-align:left;padding:6px;border:1px solid #C9C4BE;font-size:11px;text-transform:uppercase}
td{border:1px solid var(--borde);padding:5px 6px}
td.n{text-align:right;white-space:nowrap}
td.u{font-size:12px;color:var(--gris)}
tr.tot td{font-weight:900;background:var(--arena);font-size:14px}
td,th{overflow-wrap:anywhere}
/* En pantallas de telefono, cada fila del resultado se vuelve un bloque legible:
   asi las tablas de Agua potable y Canalizacion ya no se salen del encuadre */
@media(max-width:600px){
  table.resp, table.resp tbody, table.resp tr, table.resp td{display:block;width:100%}
  table.resp tr{border:1px solid var(--borde);border-radius:10px;padding:8px 10px;margin-bottom:7px;background:#fff}
  table.resp td{border:0;padding:0}
  table.resp td:nth-child(1){font-size:11px;color:var(--gris);text-transform:uppercase;font-weight:700;letter-spacing:.3px;line-height:1.3}
  table.resp td:nth-child(2){font-size:19px;font-weight:900;color:var(--negro);text-align:left;white-space:normal;line-height:1.25;margin-top:2px}
  table.resp td:nth-child(3){font-size:12.5px;color:var(--gris);text-align:left;white-space:normal;margin-top:2px}
  table.resp tr.tot{background:var(--arena);border-color:var(--ambar);border-width:2px}
  .card{overflow-x:visible}
}
.pill{display:inline-block;background:var(--arena);border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700}
.hint{font-size:12px;color:var(--gris);margin:6px 0}
.nota{background:#FFF3D6;border-left:4px solid var(--ambar);padding:9px 11px;border-radius:8px;font-size:12.5px;margin:10px 0 0}
.fuente{background:var(--arena);border-radius:8px;padding:7px 9px;font-size:11.5px;color:var(--gris);margin-top:8px}
.sec{display:none}.sec.on{display:block}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--borde);display:flex;z-index:40}
.tabs button{flex:1;border:0;background:none;padding:9px 2px;font-size:10px;font-weight:700;color:var(--gris);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button.on{color:var(--carbon)}.tabs .ic{width:25px;height:25px;border-radius:8px;background:var(--arena);display:grid;place-items:center;font-size:13px}
.tabs button.on .ic{background:var(--ambar)}

/* La marca de la cabecera lleva a la pantalla principal: en la computadora no hay
   botones de navegacion entre herramientas, asi que el logo es el camino de vuelta. */
.hdr a.marca{display:flex;gap:10px;align-items:center;color:inherit;text-decoration:none;cursor:pointer}
.hdr a.marca:hover{opacity:.82}
.hdr a.marca:focus-visible{outline:2px solid var(--ambar);outline-offset:3px;border-radius:8px}
.hdr .ir{font-size:11px;font-weight:700;opacity:.6;margin-left:auto;white-space:nowrap}
@media(max-width:430px){.hdr .ir{display:none}}
</style>

function pesoBolsa(t){
  var m=String(t==null?"":t).replace(",",".").match(/(\d+(?:\.\d+)?)/);
  return m? parseFloat(m[1]) : 50;
}

/* Sección de cada perfil en mm² */
function perfilA(x){
  if(!x) return 0;
  if(x.A) return x.A*100;                                    /* IPE: la tabla da cm² */
  var a=x.a,b=x.b||x.a,t=x.t;
  if(x.f==="cua") return 4*t*(a-t);
  if(x.f==="rec") return 2*t*(a+b-2*t);
  if(x.f==="red") return Math.PI*(a-t)*t;
  if(x.f==="ang") return t*(a+b-t);
  if(x.f==="pla") return a*t;
  if(x.f==="var") return Math.PI*a*a/4;
  if(x.f==="c")   return t*(a+2*b+2*x.c)-4*t*t;
  return 0;
}
function perfilKg(x){ return x&&x.kg ? x.kg : perfilA(x)*DENS_ACERO; }        /* kg/m */
/* Perímetro exterior en mm: sirve para pintar y para la soldadura de la placa base */
function perfilPerim(x){
  if(!x) return 0;
  var a=x.a,b=x.b||x.a;
  if(x.f==="cua") return 4*a;
  if(x.f==="rec") return 2*(a+b);
  if(x.f==="red") return Math.PI*a;
  if(x.f==="ang") return 2*(a+b);
  if(x.f==="pla") return 2*(a+x.t);
  if(x.f==="var") return Math.PI*a;
  if(x.f==="c")   return 2*(a+2*b+2*x.c);
  if(x.f==="ipe") return 2*(b*0+ (a) )+4*(a/2);              /* aproximado para viga IPE */
  return 0;
}
/* Momento de inercia mínimo (mm⁴). Se descompone la sección en rectángulos y se
   buscan los ejes principales: así vale para el ángulo y para el canal, que no
   tienen la misma inercia en las dos direcciones. */
function rectsPerfil(x){
  var r=[],a=x.a,b=x.b||x.a,t=x.t;
  if(x.f==="cua"||x.f==="rec"){
    r.push({x:0,y:0,b:a,h:t}); r.push({x:0,y:b-t,b:a,h:t});
    r.push({x:0,y:t,b:t,h:b-2*t}); r.push({x:a-t,y:t,b:t,h:b-2*t});
  } else if(x.f==="ang"){
    r.push({x:0,y:0,b:t,h:a}); r.push({x:t,y:0,b:a-t,h:t});
  } else if(x.f==="c"){
    r.push({x:0,y:0,b:t,h:a});
    r.push({x:t,y:0,b:b,h:t}); r.push({x:t,y:a-t,b:b,h:t});
    r.push({x:t+b-t,y:t,b:t,h:x.c}); r.push({x:t+b-t,y:a-t-x.c,b:t,h:x.c});
  } else if(x.f==="pla"){ r.push({x:0,y:0,b:a,h:t}); }
  return r;
}
function inerciaMin(rects){
  var A=0,sx=0,sy=0,i,r;
  for(i=0;i<rects.length;i++){ r=rects[i]; var ar=r.b*r.h; A+=ar; sx+=ar*(r.x+r.b/2); sy+=ar*(r.y+r.h/2); }
  if(!A) return {A:0,Ix:0,Iy:0,Imin:0};
  var xc=sx/A, yc=sy/A, Ix=0, Iy=0, Ixy=0;
  for(i=0;i<rects.length;i++){ r=rects[i];
    var a2=r.b*r.h, dx=r.x+r.b/2-xc, dy=r.y+r.h/2-yc;
    Ix += r.b*r.h*r.h*r.h/12 + a2*dy*dy;
    Iy += r.h*r.b*r.b*r.b/12 + a2*dx*dx;
    Ixy += a2*dx*dy; }
  var p=(Ix+Iy)/2, d=(Ix-Iy)/2;
  return {A:A,Ix:Ix,Iy:Iy,Ixy:Ixy,Imin:p-Math.sqrt(d*d+Ixy*Ixy),xc:xc,yc:yc};
}
function perfilImin(x){
  if(!x) return 0;
  if(x.f==="ipe") return x.Iy*10000;                        /* IPE: la tabla da cm⁴ */
  if(x.f==="red"){ var D=x.a,t=x.t; return Math.PI*(Math.pow(D,4)-Math.pow(D-2*t,4))/64; }
  if(x.f==="var") return Math.PI*Math.pow(x.a,4)/64;
  var s=inerciaMin(rectsPerfil(x));
  return s.Imin;
}
function perfilImax(x){
  if(!x) return 0;
  if(x.f==="ipe") return x.Ix*10000;
  if(x.f==="red") return Math.PI*(Math.pow(x.a,4)-Math.pow(x.a-2*x.t,4))/64;
  if(x.f==="var") return Math.PI*Math.pow(x.a,4)/64;
  var s=inerciaMin(rectsPerfil(x));
  return s.Ix;
}
function perfilRmin(x){
  if(!x) return 0;
  if(x.f==="ipe") return Math.sqrt(x.Iy*10000/(x.A*100));
  if(x.f==="red") return Math.sqrt(perfilImin(x)/perfilA(x));
  if(x.f==="var")  return x.a/4;
  var s=inerciaMin(rectsPerfil(x));            /* misma descomposicion que la inercia */
  return s.A? Math.sqrt(s.Imin/s.A) : 0;
}
/* Tabla J2.4 de AWS D1.1 / AISC: filete mínimo según el espesor de la plancha más delgada */
function fileteMin(e){
  if(e<=6) return 3;
  if(e<=13) return 5;
  if(e<=19) return 6;
  return 8;
}
function fileteMax(e){ return e<6? e : e-1.5; }
/* Filete que se puede ejecutar de verdad: entre el minimo de la norma y el maximo
   que aguanta el borde. Con plancha de menos de 3 mm la norma pide mas de lo que
   la plancha permite, y ahi manda el espesor. */
function filetePractico(e){ return Math.min(Math.max(fileteMin(e),3), Math.max(fileteMax(e),1)); }
function avisoFilete(e){ return fileteMin(e)>fileteMax(e)? "La plancha de "+M(e,1)+" mm es mas delgada que el filete minimo que pide la norma ("+fileteMin(e)+" mm): se suelda con electrodo de 2,5 mm y el cordon queda limitado por el espesor. Para trabajo estructural no conviene bajar de 3 mm de espesor. " : ""; }
/* Metal depositado y electrodo consumido por metro de cordón de filete */
function kgCordon(z,proceso){
  var area=(Number(z)||0)*(Number(z)||0)/2;                 /* mm² de garganta del filete */
  var dep=area*1000*1e-9*7850;                              /* kg de metal depositado por metro */
  var ef=(proceso==="MIG/MAG (GMAW)")?0.95:((proceso==="Flux core (FCAW)")?0.85:0.60);
  return {dep:dep, consum:dep/ef, ef:ef};
}
/* Comprobación preliminar de esbeltez y de flecha (no sustituye el diseño firmado) */
function chequeoEsbeltez(K,L,r){ var klr=(K*L*1000)/(r||1); return {klr:klr, ok:klr<=200, limite:200}; }
function flechaViga(wkgm,L,I){   /* w en kg/m, L en m, I en mm⁴ → flecha en mm */
  var w=(Number(wkgm)||0)*9.81/1000;                        /* N/mm */
  var Lm=(Number(L)||0)*1000;                               /* mm */
  var I4=Number(I)||0;
  if(!I4||!Lm) return 0;
  return 5*w*Math.pow(Lm,4)/(384*E_ACERO*I4);
}

    var est=laterales+baseTecho+plinto+repisas+divisiones;
    var np=0, puer=0;

      ["Tapacanto o canteado de PVC",M(tc,1),"m"],
      ["Rollos de tapacanto de 50 m",rollos,"rollos"],
      ["Bisagras de cazoleta de 35 mm",bisagras,"unidades"],
      ["Juegos de riel para puerta corrediza",rieles,"juegos"],
      ["Correderas telescópicas para cajón",nc,"pares"],
      ["Jaladores o tiradores",jaladores,"unidades"],
      ["Tubo de colgar de closet",M(tubo,2),"m"],
      ["Patas o niveladores (una cada 50 cm)",patas,"unidades"],
      ["Tornillos 3,5 x 16 mm (bisagras)",bisagras*2,"unidades"],
      ["Tornillos 4 x 40 mm de armado (20 por m²)",arriba(area18*20),"unidades"],
      ["Tornillos para aglomerado (cajones)",nc*8,"unidades"],
      ["Cola blanca para madera (0,15 kg por m²)",M(area18*0.15,2),"kg"]
    ],
    nota:"Cuenta las piezas de un mueble recto: 2 laterales, base y techo, plinto, entrepaños, divisiones, puertas, frentes y cajas de cajón. La plancha estándar en Ecuador mide 1,83 x 2,44 m (4,47 m²); el fondo de 4 mm se pide aparte. El desperdicio del 18 % es lo normal porque las piezas no calzan exactas en la plancha: para el despiece optimizado usa la aplicación Despiece y Corte, que reparte las piezas con el menor sobrante.",
    fuente:"Medidas comerciales de los tableros de melamina y MDF en Ecuador (plancha 1,83 x 2,44 m), espesores de 15 y 18 mm, y práctica del oficio para el armado de muebles"};  },

/* ===================== INTERFAZ ===================== */
var actual=0;
function $(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function valor(a,k){ var e=$(a.id+"_"+k); if(!e) return null; return e.value; }
function leer(a){ var v={}; a.campos.forEach(function(c){ var x=valor(a,c.k);
  v[c.k] = (c.t==="num")? (Number(x)||0) : x; }); return v; }
/* Rubro al que pertenece la actividad que se esta viendo */
function rubroDe(i){ return ACTIVIDADES[i] ? ACTIVIDADES[i].rubro : RUBROS[0].id; }
function cuantasDe(id){ return ACTIVIDADES.filter(function(a){ return a.rubro===id; }).length; }
function primeraDe(id){ var k=-1; ACTIVIDADES.forEach(function(a,i){ if(k<0 && a.rubro===id) k=i; }); return k; }
function pintarRubros(){
  var r=rubroDe(actual), h="";
  RUBROS.forEach(function(x){
    h+='<span class="chip rub'+(x.id===r?" on":"")+'" onclick="irRubro(\''+x.id+'\')">'
      +x.icono+" "+esc(x.nombre)+' <span class="n">'+cuantasDe(x.id)+'</span></span>'; });
  $("rubros").innerHTML=h;
}
/* Solo las actividades del rubro elegido */
function pintarChips(){
  var r=rubroDe(actual), h="";
  ACTIVIDADES.forEach(function(a,i){
    if(a.rubro!==r) return;
    h+='<span class="chip'+(i===actual?" on":"")+'" onclick="irA('+(i-actual)+')">'+a.icono+" "+esc(a.corto||a.nombre)+'</span>'; });
  $("chips").innerHTML=h;
}
/* Saltar al primer calculo del rubro elegido */
function irRubro(id){
  var k=primeraDe(id);
  if(k>=0 && k!==actual) irA(k-actual);
}
function pintarSecciones(){
  var h="";
  ACTIVIDADES.forEach(function(a,i){
    var f="";
    a.campos.forEach(function(c){
      f+='<div><label>'+esc(c.e)+'</label>';
      if(c.t==="sel"){
        f+='<select id="'+a.id+'_'+c.k+'" onchange="calcular('+i+')">';
        c.op.forEach(function(o){ f+='<option value="'+esc(o)+'"'+(String(o)===String(c.v)?" selected":"")+'>'+esc(o)+'</option>'; });
        f+='</select>';
      } else {
        f+='<input id="'+a.id+'_'+c.k+'" type="number" step="any" value="'+c.v+'" oninput="calcular('+i+')">';
      }
      f+='</div>';
    });
    h+='<section class="sec'+(i===actual?" on":"")+'" id="sec_'+a.id+'">'
      +'<div class="card"><h2>'+a.icono+" "+esc(a.nombre)+'</h2><div class="row">'+f+'</div></div>'
      +'<div class="card"><h2>Resultado</h2><div id="res_'+a.id+'"></div></div></section>';
  });
  $("secciones").innerHTML=h;
}
function calcular(i){
  var a=ACTIVIDADES[i], v=leer(a);
  try{
    var r=a.calc(v);
    var h='<table class="resp"><tbody>';
    r.filas.forEach(function(f){
      var tot=/^(TOTAL|ÁREA TOTAL|Cemento$)/.test(f[0]);
      h+='<tr'+(tot?' class="tot"':'')+'><td>'+esc(f[0])+'</td><td class="n"><b>'+esc(f[1])+'</b></td><td class="u">'+esc(f[2])+'</td></tr>';
    });
    h+='</tbody></table>';
    if(r.nota) h+='<div class="nota">'+esc(r.nota)+'</div>';
    if(r.fuente) h+='<div class="fuente">Base del cálculo: '+esc(r.fuente)+'</div>';
    h+='<div class="row acciones" style="margin-top:10px"><button class="btn ambar" onclick="enviar('+i+')">Enviar esta cantidad al cotizador</button>'
      +'<button class="btn gris" onclick="window.print()">Imprimir</button></div>';
    $("res_"+a.id).innerHTML=h;
    window.__ult={i:i,v:v,r:r};
  }catch(e){ $("res_"+a.id).innerHTML='<div class="nota">Revisa los datos ingresados.</div>'; }
}
function irA(d,btn){
  if(d===-1) actual=(actual-1+ACTIVIDADES.length)%ACTIVIDADES.length;
  else if(d===1) actual=(actual+1)%ACTIVIDADES.length;
  else actual=Math.max(0,Math.min(ACTIVIDADES.length-1, actual+d));
  document.querySelectorAll(".sec").forEach(function(s,k){ s.classList.toggle("on",k===actual); });
  pintarRubros(); pintarChips(); calcular(actual); window.scrollTo(0,0);
}
function enviar(i){
  var idx=(i===undefined)? actual : i;
